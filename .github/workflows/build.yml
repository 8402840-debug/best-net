name: Build EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller

      - name: Build exe
        run: |
          pyinstaller --onefile --console --name CardVault --icon "icon.ico" --add-data "card-vault.html;." app.py

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: CardVault-exe
          path: dist/CardVault.exe
