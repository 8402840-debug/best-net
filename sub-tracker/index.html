<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>订阅到期提醒</title>
<style>
  :root{
    --font-ui: -apple-system, "Segoe UI", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono: ui-monospace, "Cascadia Mono", "Segoe UI Mono", Consolas, monospace;
    --bg: #0b0e16;
    --surface: #131826;
    --surface-2: #19202f;
    --border: #262e40;
    --text: #eef0f5;
    --text-dim: #838b9c;
    --accent: #7c8cf8;
    --accent-dim: #5561c9;
    --warn: #e0a94d;
    --danger: #ef6b62;
    --success: #4fd1a5;
  }
  body[data-theme="light"]{
    --bg:#f5f6fa; --surface:#ffffff; --surface-2:#eef0f7; --border:#e2e4ec;
    --text:#171a22; --text-dim:#6b7280; --accent:#5561c9; --accent-dim:#7c8cf8;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; background: var(--bg); color: var(--text); font-family: var(--font-ui); -webkit-font-smoothing:antialiased; }
  #app{ opacity:0; transition: opacity .18s ease; } #app.ready{ opacity:1; }
  .wrap{ max-width:1040px; margin:0 auto; padding:34px 22px 90px; }

  header{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:6px; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand h1{ font-size:20px; font-weight:800; margin:0; letter-spacing:-0.3px; }
  .brand p{ margin:3px 0 0; font-size:12px; color: var(--text-dim); }
  .accent-line{ height:2px; width:46px; margin-top:6px; border-radius:2px; background: linear-gradient(90deg, var(--accent), transparent, var(--accent)); background-size:200% 100%; animation: shimmer 3.2s linear infinite; }
  @keyframes shimmer{ 0%{background-position:0% 0;} 100%{background-position:200% 0;} }
  .icon-btn{ background: var(--surface); border:1px solid var(--border); color: var(--text-dim); width:34px; height:34px; border-radius:9px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition: border-color .15s ease, color .15s ease; }
  .icon-btn:hover{ border-color: var(--accent); color: var(--accent); }

  .stats-row{ display:flex; gap:10px; flex-wrap:wrap; margin:22px 0 4px; }
  .stat-pill{ background: var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 18px; font-size:12.5px; color:var(--text-dim); display:flex; align-items:baseline; gap:7px; box-shadow:0 4px 12px rgba(0,0,0,.15); }
  .stat-pill b{ font-size:19px; color: var(--text); font-family:var(--font-mono); font-weight:700; }
  .stat-pill.warn b{ color: var(--warn); } .stat-pill.danger b{ color: var(--danger); } .stat-pill.success b{ color: var(--success); }

  .toolbar{ display:flex; gap:10px; margin:20px 0 14px; flex-wrap:wrap; }
  .search{ flex:1; min-width:180px; background: var(--surface); border:1px solid var(--border); border-radius:10px; padding:11px 14px; color: var(--text); font-size:14px; }
  .search:focus{ outline:none; border-color: var(--accent); }
  .sel{ background: var(--surface); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:10px 12px; font-size:13px; cursor:pointer; }
  button{ font-family: var(--font-ui); cursor:pointer; border:none; }
  .btn{ background: var(--surface); border:1px solid var(--border); color: var(--text); padding:10px 15px; border-radius:10px; font-size:13px; font-weight:500; display:flex; align-items:center; gap:7px; transition: border-color .15s ease, background .15s ease; }
  .btn:hover{ border-color: var(--accent); background: var(--surface-2); }
  .btn-primary{ background: linear-gradient(135deg, var(--accent), var(--accent-dim)); color:#fff; font-weight:700; border:1px solid transparent; box-shadow:0 4px 14px rgba(124,140,248,.3); }
  .btn-primary:hover{ filter:brightness(1.08); }

  .filter-row{ display:flex; gap:8px; overflow-x:auto; margin-bottom:20px; padding-bottom:4px; }
  .f-chip{ flex-shrink:0; font-size:12px; padding:6px 13px; border-radius:99px; cursor:pointer; background: var(--surface); border:1px solid var(--border); color: var(--text-dim); white-space:nowrap; transition: all .12s ease; }
  .f-chip.active{ background: var(--accent); border-color: var(--accent); color:#fff; font-weight:600; }

  .grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(270px,1fr)); gap:16px; }
  .sub-card{ position:relative; border-radius:15px; padding:19px 19px 16px; background: var(--surface); border:1px solid var(--border); border-left:4px solid var(--accent); display:flex; flex-direction:column; gap:10px; transition: transform .16s ease, box-shadow .16s ease; }
  .sub-card:hover{ transform: translateY(-3px); box-shadow:0 14px 26px rgba(0,0,0,.25); }
  .sub-card.expired{ border-left-color: var(--danger); }
  .sub-card.soon{ border-left-color: var(--warn); }
  .sub-card.active{ border-left-color: var(--success); }
  .sc-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .sc-name-row{ display:flex; align-items:center; gap:8px; }
  .sc-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .sc-customer{ font-size:14.5px; font-weight:700; }
  .sc-product{ font-size:12px; color: var(--text-dim); margin-top:2px; margin-left:17px; }
  .sc-edit{ background:none; border:none; color: var(--text-dim); cursor:pointer; padding:2px; flex-shrink:0; }
  .sc-edit:hover{ color: var(--accent); }
  .sc-days{ font-family: var(--font-mono); font-size:26px; font-weight:800; }
  .sc-days.expired{ color: var(--danger); } .sc-days.soon{ color: var(--warn); } .sc-days.active{ color: var(--success); }
  .sc-date{ font-size:11.5px; color: var(--text-dim); font-family: var(--font-mono); }
  .sc-footer{ display:flex; justify-content:space-between; align-items:center; margin-top:4px; padding-top:10px; border-top:1px solid var(--border); }
  .sc-tag{ font-size:10.5px; padding:3px 9px; border-radius:99px; background: var(--surface-2); color: var(--text-dim); }
  .sc-renew{ background: var(--surface-2); border:1px solid var(--border); color: var(--accent); font-size:11.5px; padding:6px 11px; border-radius:8px; }
  .sc-renew:hover{ border-color: var(--accent); }

  .empty{ grid-column:1/-1; text-align:center; padding:60px 20px; border:1px dashed var(--border); border-radius:15px; color:var(--text-dim); }
  .empty h3{ color:var(--text); font-size:15px; margin:12px 0 6px; }
  .empty p{ margin:0; font-size:13px; }

  .overlay{ position:fixed; inset:0; background: rgba(4,5,10,.68); display:none; align-items:center; justify-content:center; z-index:60; padding:20px; backdrop-filter: blur(6px); }
  .overlay.show{ display:flex; animation: fadeIn .14s ease; }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  .modal{ background: var(--surface); border:1px solid var(--border); border-radius:18px; width:100%; max-width:420px; padding:26px; max-height:88vh; overflow-y:auto; animation: pop .16s ease; box-shadow:0 24px 60px rgba(0,0,0,.4); }
  @keyframes pop{ from{ opacity:0; transform: scale(.96) translateY(6px);} to{opacity:1; transform:none;} }
  .modal h2{ font-size:16px; margin:0 0 16px; font-weight:700; }
  .field{ margin-bottom:13px; }
  .field label{ display:block; font-size:11.5px; color:var(--text-dim); margin-bottom:6px; }
  .field input, .field textarea, .field select{ width:100%; background: var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:9px 11px; color:var(--text); font-size:13.5px; font-family: var(--font-ui); }
  .field input:focus, .field textarea:focus, .field select:focus{ outline:none; border-color: var(--accent); }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .quick-dur{ display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .quick-dur button{ background: var(--surface-2); border:1px solid var(--border); color:var(--text-dim); font-size:11.5px; padding:5px 10px; border-radius:7px; }
  .quick-dur button:hover{ border-color: var(--accent); color: var(--accent); }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }
  .danger-text{ color: var(--danger); background:none; border:none; font-size:12px; margin-right:auto; cursor:pointer; }

  .swatches{ display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
  .swatch{ width:26px; height:26px; border-radius:7px; cursor:pointer; border:2px solid transparent; }
  .swatch.selected{ border-color: var(--text); }
  .tag-indigo{ background:#7c8cf8; } .tag-teal{ background:#4fd1a5; } .tag-amber{ background:#e0a94d; }
  .tag-rose{ background:#ef6b9e; } .tag-violet{ background:#b083f0; }

  .more-toggle{ display:flex; align-items:center; justify-content:space-between; padding:11px 13px; margin:14px 0 4px; background: var(--surface-2); border:1px solid var(--border); border-radius:9px; cursor:pointer; font-size:12.5px; color: var(--text-dim); }
  .more-toggle svg{ transition: transform .15s ease; }
  .more-toggle.open svg{ transform: rotate(180deg); }
  .more-body{ padding-top:12px; }

  .toast{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background: var(--surface); border:1px solid var(--accent); color:var(--text); padding:9px 16px; border-radius:9px; font-size:13px; z-index:120; opacity:0; pointer-events:none; transition: opacity .2s ease; }
  .toast.show{ opacity:1; }
  footer{ text-align:center; margin-top:44px; color:var(--text-dim); font-size:11.5px; }
</style>
</head>
<body>
<div id="app">
<div class="wrap">
  <header>
    <div class="brand">
      <div>
        <h1>订阅到期提醒</h1>
        <p>记录客户购买的到期时间，快到期自动提醒</p>
        <div class="accent-line"></div>
      </div>
    </div>
    <button class="icon-btn" id="themeToggle" title="切换主题">
      <svg id="themeIcon" width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z" stroke="currentColor" stroke-width="1.6"/></svg>
    </button>
  </header>

  <div class="stats-row" id="statsRow"></div>

  <div class="toolbar">
    <input class="search" id="searchInput" placeholder="搜索客户名称 / 商品...">
    <select class="sel" id="sortSelect">
      <option value="expiry">按到期时间</option>
      <option value="recent">按添加时间</option>
      <option value="name">按客户名称</option>
    </select>
    <button class="btn" id="exportBtn" title="导出表格">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <button class="btn btn-primary" id="addBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
      添加订阅
    </button>
  </div>

  <div class="filter-row" id="filterRow"></div>
  <div class="grid" id="subGrid"></div>

  <footer>数据保存在本地浏览器中，不会上传到任何服务器</footer>
</div>
</div>

<div class="overlay" id="formOverlay">
  <div class="modal">
    <h2 id="formTitle">添加订阅</h2>
    <input type="hidden" id="editId">
    <div class="field"><label>客户名称</label><input id="f_customer" placeholder="例如：张三 / @telegram用户名"></div>
    <div class="field"><label>商品名称</label><input id="f_product" placeholder="例如：Netflix高级会员 / Telegram Premium"></div>
    <div class="field">
      <label>到期时间</label>
      <input type="date" id="f_expiry">
      <div class="quick-dur">
        <button type="button" data-days="7">+7天</button>
        <button type="button" data-days="30">+30天</button>
        <button type="button" data-days="90">+90天</button>
        <button type="button" data-days="180">+180天</button>
        <button type="button" data-days="365">+365天</button>
      </div>
    </div>
    <div class="field">
      <label>标签颜色</label>
      <div class="swatches" id="tagSwatches">
        <div class="swatch tag-indigo selected" data-tag="tag-indigo" title="靛蓝"></div>
        <div class="swatch tag-teal" data-tag="tag-teal" title="青绿"></div>
        <div class="swatch tag-amber" data-tag="tag-amber" title="琥珀"></div>
        <div class="swatch tag-rose" data-tag="tag-rose" title="玫瑰"></div>
        <div class="swatch tag-violet" data-tag="tag-violet" title="紫罗兰"></div>
      </div>
    </div>
    <div class="more-toggle" id="moreToggle">
      <span>更多信息（联系方式 / 价格 / 备注）</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </div>
    <div class="more-body" id="moreBody" style="display:none;">
      <div class="field"><label>联系方式（可选）</label><input id="f_contact" placeholder="Telegram / 邮箱 / 电话"></div>
      <div class="field-row">
        <div class="field"><label>价格</label><input type="number" id="f_price" placeholder="0" step="any"></div>
        <div class="field"><label>货币</label><input id="f_currency" placeholder="CNY" value="CNY"></div>
      </div>
      <div class="field"><label>备注（可选）</label><textarea id="f_note" rows="2"></textarea></div>
    </div>
    <div class="modal-actions">
      <button class="danger-text" id="deleteBtn" style="display:none;">删除</button>
      <button class="btn" id="cancelBtn">取消</button>
      <button class="btn btn-primary" id="saveBtn">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
const STORE_KEY = 'subTrackerData_v1';
const THEME_KEY = 'subTrackerTheme';
let subs = [];
let activeFilter = 'all';

function uid(){ return 's_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }
function escapeHtml(str){ const d=document.createElement('div'); d.textContent = str||''; return d.innerHTML; }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1600); }
function loadSubs(){ try{ const raw = localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : []; }catch(e){ return []; } }
function saveSubs(){ localStorage.setItem(STORE_KEY, JSON.stringify(subs)); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

function daysLeft(expiry){
  const exp = new Date(expiry + 'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((exp - now) / (1000*60*60*24));
}
function statusOf(expiry){
  const d = daysLeft(expiry);
  if(d < 0) return 'expired';
  if(d <= 7) return 'soon';
  return 'active';
}

/* ---- 主题 ---- */
function applyTheme(theme){
  document.body.dataset.theme = theme;
  document.getElementById('themeIcon').innerHTML = theme==='light'
    ? '<circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.6"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8 6 18M18 6l1.8-1.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>'
    : '<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z" stroke="currentColor" stroke-width="1.6"/>';
  localStorage.setItem(THEME_KEY, theme);
}
document.getElementById('themeToggle').addEventListener('click', ()=> applyTheme(document.body.dataset.theme==='light' ? 'dark' : 'light'));

/* ---- 统计 ---- */
function renderStats(){
  const row = document.getElementById('statsRow');
  if(subs.length === 0){ row.innerHTML=''; return; }
  const expired = subs.filter(s=> statusOf(s.expiry)==='expired').length;
  const soon = subs.filter(s=> statusOf(s.expiry)==='soon').length;
  const active = subs.length - expired - soon;
  row.innerHTML = `
    <div class="stat-pill">总数 <b>${subs.length}</b></div>
    <div class="stat-pill success">正常 <b>${active}</b></div>
    <div class="stat-pill warn">7天内到期 <b>${soon}</b></div>
    <div class="stat-pill danger">已过期 <b>${expired}</b></div>`;
}

/* ---- 筛选chip ---- */
function renderFilterRow(){
  const row = document.getElementById('filterRow');
  if(subs.length === 0){ row.innerHTML=''; return; }
  const filters = [
    {key:'all', label:'全部'},
    {key:'soon', label:'即将到期'},
    {key:'expired', label:'已过期'},
    {key:'active', label:'正常'}
  ];
  row.innerHTML = filters.map(f=> `<span class="f-chip ${activeFilter===f.key?'active':''}" data-f="${f.key}">${f.label}</span>`).join('');
  row.querySelectorAll('.f-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{ activeFilter = chip.dataset.f; renderGrid(); });
  });
}

/* ---- 网格渲染 ---- */
function renderGrid(){
  const grid = document.getElementById('subGrid');
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const sortMode = document.getElementById('sortSelect').value;

  renderStats();
  renderFilterRow();

  let filtered = subs.filter(s=>{
    const matchesQ = !q || (s.customer||'').toLowerCase().includes(q) || (s.product||'').toLowerCase().includes(q);
    const matchesF = activeFilter==='all' || statusOf(s.expiry)===activeFilter;
    return matchesQ && matchesF;
  });

  if(sortMode==='name') filtered.sort((a,b)=>(a.customer||'').localeCompare(b.customer||''));
  else if(sortMode==='recent') filtered.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  else filtered.sort((a,b)=> daysLeft(a.expiry)-daysLeft(b.expiry));

  if(filtered.length===0){
    grid.innerHTML = `<div class="empty">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="2" stroke="#8590a6" stroke-width="1.4"/><path d="M3 10h18M8 3v4M16 3v4" stroke="#8590a6" stroke-width="1.4"/></svg>
      <h3>${subs.length===0?'还没有订阅记录':'没有找到匹配的记录'}</h3>
      <p>${subs.length===0?'点击右上方"添加订阅"开始记录':'换个关键词或筛选条件试试'}</p>
    </div>`;
    return;
  }

  grid.innerHTML = filtered.map(s=>{
    const st = statusOf(s.expiry);
    const d = daysLeft(s.expiry);
    const dayLabel = st==='expired' ? `已过期 ${Math.abs(d)} 天` : (d===0 ? '今天到期' : `剩 ${d} 天`);
    return `
    <div class="sub-card ${st}" data-id="${s.id}">
      <div class="sc-top">
        <div>
          <div class="sc-name-row"><span class="sc-dot ${s.tag||'tag-indigo'}"></span><span class="sc-customer">${escapeHtml(s.customer||'未命名客户')}</span></div>
          <div class="sc-product">${escapeHtml(s.product||'')}</div>
        </div>
        <button class="sc-edit" data-edit="${s.id}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" stroke="currentColor" stroke-width="1.5"/></svg></button>
      </div>
      <div class="sc-days ${st}">${dayLabel}</div>
      <div class="sc-date">到期日：${s.expiry}</div>
      <div class="sc-footer">
        <span class="sc-tag">${escapeHtml((s.price||s.price===0)? (s.currency||'CNY')+' '+s.price : '')}</span>
        <button class="sc-renew" data-renew="${s.id}">续费 +30天</button>
      </div>
    </div>`;
  }).join('');

  grid.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); openEditForm(btn.dataset.edit); });
  });
  grid.querySelectorAll('[data-renew]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const s = subs.find(x=>x.id===btn.dataset.renew); if(!s) return;
      const base = statusOf(s.expiry)==='expired' ? new Date() : new Date(s.expiry+'T00:00:00');
      base.setDate(base.getDate()+30);
      s.expiry = base.toISOString().slice(0,10);
      saveSubs(); renderGrid();
      showToast('已续费30天');
    });
  });
}

/* ---- 表单 ---- */
const formOverlay = document.getElementById('formOverlay');
let selectedTag = 'tag-indigo';
function updateTagSelection(){
  document.querySelectorAll('#tagSwatches .swatch').forEach(s=> s.classList.toggle('selected', s.dataset.tag===selectedTag));
}
document.getElementById('tagSwatches').addEventListener('click', (e)=>{
  const sw = e.target.closest('.swatch'); if(!sw) return;
  selectedTag = sw.dataset.tag; updateTagSelection();
});
document.getElementById('moreToggle').addEventListener('click', ()=>{
  const body = document.getElementById('moreBody');
  const open = body.style.display === 'block';
  body.style.display = open ? 'none' : 'block';
  document.getElementById('moreToggle').classList.toggle('open', !open);
});

function openAddForm(){
  document.getElementById('formTitle').textContent = '添加订阅';
  document.getElementById('editId').value = '';
  ['f_customer','f_contact','f_product','f_note'].forEach(id=> document.getElementById(id).value='');
  document.getElementById('f_price').value = '';
  document.getElementById('f_currency').value = 'CNY';
  document.getElementById('f_expiry').value = todayStr();
  selectedTag = 'tag-indigo'; updateTagSelection();
  document.getElementById('moreBody').style.display = 'none';
  document.getElementById('moreToggle').classList.remove('open');
  document.getElementById('deleteBtn').style.display = 'none';
  formOverlay.classList.add('show');
  setTimeout(()=> document.getElementById('f_customer').focus(), 40);
}
function openEditForm(id){
  const s = subs.find(x=>x.id===id); if(!s) return;
  document.getElementById('formTitle').textContent = '编辑订阅';
  document.getElementById('editId').value = id;
  document.getElementById('f_customer').value = s.customer||'';
  document.getElementById('f_contact').value = s.contact||'';
  document.getElementById('f_product').value = s.product||'';
  document.getElementById('f_price').value = (s.price===0||s.price) ? s.price : '';
  document.getElementById('f_currency').value = s.currency||'CNY';
  document.getElementById('f_expiry').value = s.expiry||todayStr();
  document.getElementById('f_note').value = s.note||'';
  selectedTag = s.tag || 'tag-indigo'; updateTagSelection();
  const hasMore = !!(s.contact || (s.price===0||s.price) || s.note);
  document.getElementById('moreBody').style.display = hasMore ? 'block' : 'none';
  document.getElementById('moreToggle').classList.toggle('open', hasMore);
  document.getElementById('deleteBtn').style.display = 'block';
  formOverlay.classList.add('show');
}
document.getElementById('addBtn').addEventListener('click', openAddForm);
document.getElementById('cancelBtn').addEventListener('click', ()=> formOverlay.classList.remove('show'));
formOverlay.addEventListener('click', (e)=>{ if(e.target===formOverlay) formOverlay.classList.remove('show'); });

document.querySelectorAll('.quick-dur button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const base = document.getElementById('f_expiry').value ? new Date(document.getElementById('f_expiry').value+'T00:00:00') : new Date();
    base.setDate(base.getDate() + parseInt(btn.dataset.days,10));
    document.getElementById('f_expiry').value = base.toISOString().slice(0,10);
  });
});

document.getElementById('saveBtn').addEventListener('click', ()=>{
  const customer = document.getElementById('f_customer').value.trim();
  const expiry = document.getElementById('f_expiry').value;
  if(!customer || !expiry){ showToast('请填写客户名称和到期时间'); return; }
  const editId = document.getElementById('editId').value;
  const data = {
    customer,
    contact: document.getElementById('f_contact').value.trim(),
    product: document.getElementById('f_product').value.trim(),
    price: document.getElementById('f_price').value === '' ? null : parseFloat(document.getElementById('f_price').value),
    currency: document.getElementById('f_currency').value.trim() || 'CNY',
    expiry,
    tag: selectedTag,
    note: document.getElementById('f_note').value.trim()
  };
  if(editId){
    const idx = subs.findIndex(s=>s.id===editId);
    if(idx>-1) subs[idx] = {...subs[idx], ...data};
    showToast('已更新');
  }else{
    subs.push({id: uid(), createdAt: Date.now(), ...data});
    showToast('已添加');
  }
  saveSubs(); renderGrid();
  formOverlay.classList.remove('show');
});
document.getElementById('deleteBtn').addEventListener('click', ()=>{
  const editId = document.getElementById('editId').value; if(!editId) return;
  if(confirm('确定删除这条订阅记录吗？')){
    subs = subs.filter(s=>s.id!==editId);
    saveSubs(); renderGrid();
    formOverlay.classList.remove('show');
    showToast('已删除');
  }
});

/* ---- 导出 ---- */
function toCsv(){
  const headers = ['客户','联系方式','商品','价格','货币','到期日','备注'];
  const lines = [headers.join(',')];
  subs.forEach(s=>{
    const row = [s.customer,s.contact,s.product,s.price,s.currency,s.expiry,s.note].map(v=>`"${String(v??'').replace(/"/g,'""')}"`);
    lines.push(row.join(','));
  });
  return '\uFEFF' + lines.join('\r\n');
}
async function saveViaBestMethod(content, defaultName, filters){
  if(window.electronAPI && window.electronAPI.saveFile){
    const res = await window.electronAPI.saveFile(content, defaultName, filters);
    if(res && res.ok) showToast('已保存到 ' + res.path);
    else if(!res || !res.canceled) showToast('保存失败');
    return;
  }
  const blob = new Blob([content], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = defaultName; a.click();
  URL.revokeObjectURL(url);
  showToast('已导出');
}
document.getElementById('exportBtn').addEventListener('click', ()=>{
  if(subs.length===0){ showToast('暂无数据可导出'); return; }
  saveViaBestMethod(toCsv(), 'subscriptions-export.csv', [{name:'CSV 表格', extensions:['csv']}]);
});

document.getElementById('searchInput').addEventListener('input', renderGrid);
document.getElementById('sortSelect').addEventListener('change', renderGrid);

/* ---- 启动 ---- */
applyTheme(localStorage.getItem(THEME_KEY) || 'dark');
subs = loadSubs();
renderGrid();
document.getElementById('app').classList.add('ready');
</script>
